<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast - Interactive Weather</title>
  <link rel="stylesheet" href="sky.css">
</head>

 <body>
     <!-- Main Glassmorphic Layout Card Box -->
     <div class="weather-container">
         <div class="search-box">
            <input type="text" placeholder="Enter city name..." id="city-input">
            <button id="search-btn">Search</button>
        </div>

         <!-- Row 2: Dynamic Temperature Info Section -->
         <div class="weather-display">
            <h1 id="temperature">28°C</h1>
            <h2 id="location-name">Lagos, Nigeria</h2>
            <p id="condition">Sunny Sky</p>
        </div>

     </div>
    <!--  The JavaScript Interactivity Brain Element -->
    <script src="sky.js"></script>

 </body>
</html>
